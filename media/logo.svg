<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#12141a"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9824a"/>
      <stop offset="1" stop-color="#7a4f26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d79a1e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fdc7a"/>
      <stop offset="1" stop-color="#2e9a45"/>
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8bcc6"/>
      <stop offset="1" stop-color="#6b707c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="64" fill="none" stroke="#c9a45c" stroke-opacity=".55" stroke-width="4"/>

  <!-- bag -->
  <g transform="translate(256 290)">
    <ellipse cx="0" cy="118" rx="120" ry="16" fill="#000" opacity=".35"/>
    <path d="M-52 -112 C-30 -98 30 -98 52 -112 L40 -78 C70 -60 128 0 128 56 C128 104 80 124 0 124 C-80 124 -128 104 -128 56 C-128 0 -70 -60 -40 -78 Z"
          fill="url(#bag)" stroke="#3d2610" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-44 -80 C-16 -70 16 -70 44 -80" fill="none" stroke="#3d2610" stroke-width="10" stroke-linecap="round"/>
    <path d="M-44 -80 C-16 -70 16 -70 44 -80" fill="none" stroke="#e0b070" stroke-width="4" stroke-linecap="round"/>
    <path d="M-60 -116 C-70 -150 -20 -150 -8 -126" fill="none" stroke="#3d2610" stroke-width="8" stroke-linecap="round"/>
    <path d="M60 -116 C70 -150 20 -150 8 -126" fill="none" stroke="#3d2610" stroke-width="8" stroke-linecap="round"/>
    <path d="M-90 20 C-70 -20 -40 -40 -20 -50" fill="none" stroke="#e0b070" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- keep: green check badge -->
  <g transform="translate(118 150)">
    <circle r="62" fill="url(#green)" stroke="#123d1c" stroke-width="7"/>
    <path d="M-28 2 L-8 24 L30 -22" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- auction house: gold coin -->
  <g transform="translate(256 104)">
    <circle r="66" fill="url(#gold)" stroke="#6b4300" stroke-width="7"/>
    <circle r="46" fill="none" stroke="#a86d06" stroke-width="5"/>
    <path d="M0 -30 L9 -9 L31 -9 L13 5 L20 27 L0 14 L-20 27 L-13 5 L-31 -9 L-9 -9 Z" fill="#fff6d0" stroke="#a86d06" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- vendor: grey coins -->
  <g transform="translate(394 150)">
    <circle r="62" fill="url(#grey)" stroke="#2b2e35" stroke-width="7"/>
    <ellipse cx="0" cy="18" rx="30" ry="10" fill="#4d5160"/>
    <rect x="-30" y="2" width="60" height="16" fill="#4d5160"/>
    <ellipse cx="0" cy="2" rx="30" ry="10" fill="#e3e6ec" stroke="#4d5160" stroke-width="4"/>
    <ellipse cx="0" cy="-12" rx="30" ry="10" fill="#4d5160"/>
    <rect x="-30" y="-28" width="60" height="16" fill="#4d5160"/>
    <ellipse cx="0" cy="-28" rx="30" ry="10" fill="#e3e6ec" stroke="#4d5160" stroke-width="4"/>
  </g>
</svg>
