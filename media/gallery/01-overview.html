<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeepOrSell – Overview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=block">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame"></div>

<div class="copy" style="gap: 30px;">
  <img src="../logo.png" alt="" style="width: 150px; height: 150px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6));">
  <h1 style="font-size: 104px; color: var(--gold);">KeepOrSell</h1>
  <p style="font-family: 'Friz', serif; font-size: 44px; color: #fff;">Keep it. Sell it. Scrap it.</p>
  <p>Sorts your bags into five groups and tells you why for every single item.</p>
  <p class="note">For Baganator · Auctionator · Scrap · Questie · TradeSkillMaster</p>
</div>
<div class="stage">
  <div class="bag" style="width: auto; min-width: 560px;">
    <div class="title">Bags</div>
    <div class="group"><h3 style="color: var(--group-quest)">Quest</h3><div class="row"><div class="slot"><img src="icons/inv_misc_organ_04.jpg" alt=""><span class="count">3</span></div><div class="slot"><img src="icons/inv_fabric_wool_03.jpg" alt=""></div></div></div>
    <div class="group"><h3 style="color: var(--group-profession)">Profession</h3><div class="row"><div class="slot"><img src="icons/inv_misc_leatherscrap_03.jpg" alt=""><span class="count">7</span></div><div class="slot"><img src="icons/inv_ingot_02.jpg" alt=""><span class="count">12</span></div><div class="slot"><img src="icons/inv_fabric_linen_01.jpg" alt=""><span class="count">20</span></div><div class="slot q2"><img src="icons/inv_scroll_06.jpg" alt=""></div></div></div>
    <div class="group"><h3 style="color: var(--group-ah)">AuctionHouse</h3><div class="row"><div class="slot"><img src="icons/inv_potion_52.jpg" alt=""><span class="count">4</span></div><div class="slot"><img src="icons/inv_fabric_silk_01.jpg" alt=""><span class="count">20</span></div><div class="slot q3"><img src="icons/inv_wand_04.jpg" alt=""></div></div></div>
    <div class="group"><h3 style="color: var(--group-disenchant)">Disenchant</h3><div class="row"><div class="slot q2"><img src="icons/inv_sword_04.jpg" alt=""></div><div class="slot q2"><img src="icons/inv_axe_20.jpg" alt=""></div><div class="slot q2"><img src="icons/inv_jewelry_ring_13.jpg" alt=""></div></div></div>
    <div class="group"><h3 style="color: var(--group-junk)">Junk</h3><div class="row"><div class="slot"><img src="icons/inv_misc_food_14.jpg" alt=""><span class="count">2</span></div><div class="slot"><img src="icons/inv_misc_cape_07.jpg" alt=""></div><div class="slot q3"><img src="icons/inv_pants_03.jpg" alt=""></div><div class="slot"><img src="icons/inv_bracer_03.jpg" alt=""></div></div></div>
    <div class="footer"><div class="slot destroy"><img src="icons/inv_misc_food_14.jpg" alt=""></div><span>Junk <span class="m">18<i class="c s"></i> 33<i class="c cu"></i></span> · AH <span class="m">2<i class="c g"></i> 44<i class="c s"></i> 98<i class="c cu"></i></span></span></div>
  </div>
</div>
</body>
</html>
